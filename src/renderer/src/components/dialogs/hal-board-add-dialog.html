<template>
    <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 rounded-xl shadow-2xl max-w-md w-full max-h-full flex flex-col"
            data-testid="hal-board-add-dialog">
            <div class="p-5 flex flex-col gap-4 overflow-y-auto min-h-0">
                <div class="flex flex-col gap-1">
                    <h2 class="text-base font-semibold text-gray-900 dark:text-white">Add ${board.label}</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400">Name the board and choose where it sits on the I2C bus.</p>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Name</label>
                    <input type="text" data-field="add-label" value.bind="label"
                        class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                </div>

                <div class="flex flex-col gap-1.5" if.bind="board.addressMode === 'fixed-list'">
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">I2C Address</label>
                    <select data-field="add-address" value.bind="address"
                        class="w-32 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
                        <option repeat.for="addr of board.addressOptions" model.bind="addr">${formatAddress(addr)}</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1.5" if.bind="board.addressMode === 'free-entry'">
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">I2C Address (hex)</label>
                    <input type="text" data-field="add-address" value.bind="addressText & updateTrigger:'input'"
                        class="w-32 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1.5 text-sm font-mono outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors" />
                    <p if.bind="addressInvalid" class="text-xs text-red-500">
                        Enter a hex address from ${formatAddress(board.addressRange[0])} to ${formatAddress(board.addressRange[1])}.
                    </p>
                </div>

                <div class="flex flex-col gap-1.5" if.bind="canUseMux">
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Behind Multiplexer</label>
                    <select data-field="add-parentMux" value.bind="parentMuxInstanceId" change.trigger="onMuxChange()"
                        class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
                        <option model.bind="''">(top-level bus)</option>
                        <option repeat.for="m of multiplexers" model.bind="m.instanceId">${m.label}</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1.5" if.bind="parentMuxInstanceId">
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Channel</label>
                    <select data-field="add-muxChannel" value.bind="muxChannel"
                        class="w-24 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-white/15 text-gray-900 dark:text-gray-100 rounded-md px-2 py-1.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
                        <option repeat.for="ch of channelOptions" model.bind="ch">${ch}</option>
                    </select>
                </div>

                <p if.bind="addressInUse" data-testid="hal-board-add-in-use" class="text-xs text-amber-600 dark:text-amber-400">
                    ⚠ Another board on this bus already uses this address${parentMuxInstanceId ? ' and channel' : ''}.
                </p>
            </div>
            <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-200 dark:border-white/10 shrink-0">
                <button click.trigger="cancel()"
                    class="px-4 py-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white bg-gray-900/5 dark:bg-white/5 hover:bg-gray-900/10 dark:hover:bg-white/10 rounded-lg transition-colors">
                    Cancel
                </button>
                <button click.trigger="ok()" disabled.bind="addressInvalid"
                    class="px-4 py-2 text-sm font-medium text-white rounded-lg transition-colors bg-blue-600 hover:bg-blue-500 disabled:opacity-50">
                    Create
                </button>
            </div>
        </div>
    </div>
</template>
